<svg viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de la tabla de asignacion de archivos FAT32">
  <rect x="0" y="0" width="420" height="260" fill="#fdf3e2" rx="10"/>
  <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8a5b12" font-weight="700">Tabla FAT — lista enlazada de clusters</text>

  <!-- fila de la tabla FAT -->
  <g font-family="'JetBrains Mono', monospace" font-size="10">
    <rect x="20" y="45" width="60" height="24" fill="#ffffff" stroke="#e2a73e" stroke-width="1.5"/>
    <text x="30" y="61" fill="#8a5b12">[5] → 6</text>
    <rect x="80" y="45" width="60" height="24" fill="#ffffff" stroke="#e2a73e" stroke-width="1.5"/>
    <text x="90" y="61" fill="#8a5b12">[6] → 9</text>
    <rect x="140" y="45" width="60" height="24" fill="#ffffff" stroke="#e2a73e" stroke-width="1.5"/>
    <text x="150" y="61" fill="#8a5b12">[9] → EOF</text>
  </g>

  <!-- clusters en el disco -->
  <text x="20" y="100" font-family="Inter, sans-serif" font-size="11" fill="#5c3f0a">Clusters en el disco (video.mp4 ocupa 5 → 6 → 9):</text>

  <g>
    <rect x="20" y="115" width="42" height="42" fill="#f5deb0" stroke="#8a5b12" stroke-width="1"/>
    <text x="41" y="140" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11">3</text>

    <rect x="66" y="115" width="42" height="42" fill="#f5deb0" stroke="#8a5b12" stroke-width="1"/>
    <text x="87" y="140" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11">4</text>

    <rect x="112" y="115" width="42" height="42" fill="#e2a73e" stroke="#8a5b12" stroke-width="2"/>
    <text x="133" y="140" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#3a2600">5</text>

    <rect x="158" y="115" width="42" height="42" fill="#e2a73e" stroke="#8a5b12" stroke-width="2"/>
    <text x="179" y="140" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#3a2600">6</text>

    <rect x="204" y="115" width="42" height="42" fill="#f5deb0" stroke="#8a5b12" stroke-width="1"/>
    <text x="225" y="140" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11">7</text>

    <rect x="250" y="115" width="42" height="42" fill="#f5deb0" stroke="#8a5b12" stroke-width="1"/>
    <text x="271" y="140" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11">8</text>

    <rect x="296" y="115" width="42" height="42" fill="#e2a73e" stroke="#8a5b12" stroke-width="2"/>
    <text x="317" y="140" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#3a2600">9</text>

    <path d="M133 108 Q145 95 179 108" fill="none" stroke="#8a5b12" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M179 108 Q235 90 317 108" fill="none" stroke="#8a5b12" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#8a5b12"/>
    </marker>
  </defs>

  <text x="20" y="200" font-family="Inter, sans-serif" font-size="11" fill="#5c3f0a">Sin metadatos de permisos: no diferencia usuarios.</text>
  <text x="20" y="220" font-family="Inter, sans-serif" font-size="11" fill="#5c3f0a">Límite de 4 GB por archivo.</text>
</svg>
